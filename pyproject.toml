[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iconflow"
version = "0.5.0"
description = "Turn an app brief and one semantic SVG master into a reviewed, platform-ready icon family"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "app-icon", "electron", "favicon", "icns", "ico", "icon-design",
  "pwa", "svg", "tauri", "tray-icon", "design-system",
]
authors = [{ name = "snowyukitty" }]
# The wheel ships the engine (Apache-2.0), the public-domain technique
# scaffolds, the CC BY-SA methodology `iconflow docs` serves, and the CC BY
# imagery `demo` and the playbook need, so the expression names all four.
# Every one of them is a free licence, deliberately: a noncommercial or
# no-derivatives term on anything inside the package would make the whole
# distribution non-free. IconFlow's identity is protected by TRADEMARKS.md
# instead, which is the right instrument for it. The restrictively licensed
# corpus (the 137 archive studies, gallery, showcase, examples) is not
# packaged. Icons built with the tool are the user's own work and inherit
# none of this — see LICENSES.md section 1.
license = "Apache-2.0 AND CC0-1.0 AND CC-BY-SA-4.0 AND CC-BY-4.0"
license-files = [
  "LICENSE", "NOTICE", "TRADEMARKS.md", "THIRD_PARTY_NOTICES.md",
  "LICENSES.md",
  # Only the licences the distributions actually use. The NC-ND corpus is
  # never packaged, so shipping its text would misdescribe the artifact.
  "licenses/CC0-1.0.txt", "licenses/CC-BY-SA-4.0.txt", "licenses/CC-BY-4.0.txt",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Build Tools",
  "Operating System :: OS Independent",
]
dependencies = [
  "playwright>=1.40",
  "Pillow>=10.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.14"]

[project.scripts]
iconflow = "iconflow.cli:main"

[project.urls]
Homepage = "https://ai-iconflow.com"
Repository = "https://github.com/snowyukitty/ai-iconflow"
Issues = "https://github.com/snowyukitty/ai-iconflow/issues"
Changelog = "https://github.com/snowyukitty/ai-iconflow/blob/main/CHANGELOG.md"
Documentation = "https://github.com/snowyukitty/ai-iconflow/tree/main/docs"

[tool.setuptools]
packages = [
  "iconflow",
  "iconflow.resources",
  "iconflow.resources.templates",
  "iconflow.resources.presets",
  "iconflow.resources.docs",
  "iconflow.resources.demo",
  "iconflow.resources.skill",
  "iconflow.resources.collision",
]
include-package-data = false

# Keep authoring assets in their readable top-level directories while mapping
# immutable wheel resources under the IconFlow package.  The CLI accesses them
# exclusively through importlib.resources, so `iconflow new` and `iconflow demo`
# also work from an isolated wheel install with no source checkout nearby.
[tool.setuptools.package-dir]
"iconflow.resources.templates" = "templates"
"iconflow.resources.presets" = "templates/presets"
"iconflow.resources.docs" = "docs"
"iconflow.resources.demo" = "demo"
"iconflow.resources.skill" = "skills/iconflow"

[tool.setuptools.package-data]
"iconflow.resources.templates" = ["*.svg", "LICENSE"]
"iconflow.resources.presets" = ["*.svg"]
# Figures the packaged methodology refers to, and nothing else: the README
# animation and its transcript are repository front-page assets, and half a
# megabyte of GIF has no business inside a wheel that never displays it.
"iconflow.resources.docs" = ["*.md", "assets/*.svg", "assets/*.png", "LICENSE"]
"iconflow.resources.demo" = ["master.svg", "tray.svg", "iconflow.toml", "master-review.json"]
"iconflow.resources.skill" = ["SKILL.md", "LICENSE", "agents/*.yaml"]
# The neighbourhood: the plain collision-set forms and the content-addressed
# index of fields. The house half of the index is fields only — a 16x16 grid
# and four scalars per mark — and none of the NC-ND artwork travels with it.
"iconflow.resources.collision" = ["*.svg", "index.json", "LICENSE", "README.md"]

# STATE.md is a report about *this repository* at the moment it was generated:
# open owner gates, whether the deployed site is current, whether CI is green.
# Frozen into a wheel it becomes a stale answer to a question the reader never
# asked, listed by `iconflow docs` beside the methodology — which is the exact
# drift the report was written to end. It stays in the checkout.
[tool.setuptools.exclude-package-data]
"iconflow.resources.docs" = ["STATE.md"]

# Deliberately not a style crusade.
#
# This gate exists for one reason: IconFlow supports Python 3.10 through 3.14,
# and a maintainer working on 3.12 can write code that 3.10 will not parse.
# That happened — a backslash inside an f-string expression, legal since PEP
# 701, reached `main` and only the Windows 3.10 matrix leg caught it, minutes
# after a push that looked green everywhere local.
#
# Ruff reports syntax errors against `target-version` no matter which rules are
# selected, so the narrow set below buys that whole class of failure for one
# fast job. The rules themselves are only the ones that mean "this is a bug":
# undefined names, unreachable branches, broken comparisons, dead imports.
# Restyling 250 existing files would bury the signal this exists to carry.
[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist", ".venv", "work", "work-pc4090", "test-examples"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
