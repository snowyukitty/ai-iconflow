<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">The Coral Gate — locked first frame</title>
  <desc id="desc">A warm paper field with a graphite SVG path and a sharp coral crop window, authored as the shared first frame for the IconFlow promotional video bake-off.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#17181f" stroke-width="1" opacity="0.075"/>
    </pattern>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#fff3e8" filter="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Crop-safe action stage: 608 × 1080 centered inside the 16:9 master. -->
  <g aria-label="single SVG path" fill="none" stroke="#17181f" stroke-linecap="square" stroke-linejoin="round">
    <path d="M744 640 C812 640 820 460 912 460 S1014 620 1176 456" stroke-width="30"/>
    <path d="M744 640 C812 640 820 460 912 460 S1014 620 1176 456" stroke="#fff3e8" stroke-width="12" opacity="0.98"/>
  </g>

  <g fill="#17181f">
    <rect x="730" y="626" width="28" height="28"/>
    <rect x="898" y="446" width="28" height="28"/>
    <rect x="1162" y="442" width="28" height="28"/>
  </g>

  <!-- The only brand-critical moving object. Sharp corners, flat coral, no glow. -->
  <rect x="678" y="574" width="132" height="132" fill="#fff3e8" stroke="#ff584d" stroke-width="14"/>
  <rect x="730" y="626" width="28" height="28" fill="#ff584d"/>

  <!-- Quiet registration marks make the frame feel inspected rather than invented. -->
  <g fill="#17181f" opacity="0.42">
    <rect x="656" y="208" width="2" height="72"/>
    <rect x="1262" y="800" width="2" height="72"/>
    <rect x="924" y="172" width="72" height="2"/>
    <rect x="924" y="906" width="72" height="2"/>
  </g>
</svg>
