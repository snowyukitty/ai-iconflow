name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit:
    name: Unit (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Diagnose non-browser install
        run: iconflow doctor --no-browser
      - name: Validate casebook
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          iconflow case lint
          iconflow case stats

  wheel-smoke:
    name: Isolated wheel resources
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install "build>=1.2,<2"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build
          python scripts/verify_distribution.py dist/*
      - name: Install wheel and leave the source tree
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          smoke="$RUNNER_TEMP/iconflow-wheel-smoke-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$smoke"
          cd "$smoke"
          iconflow --help >/dev/null
          iconflow styles --json > styles.json
          python -c 'import json; assert len(json.load(open("styles.json", encoding="utf-8"))) >= 10'
          iconflow new flat-geometric --out master.svg
          test -s master.svg
          iconflow init --out iconflow.toml --name "Wheel Smoke" \
            --app-intent "prove package resources" --user-job "ship one icon family" \
            --essence proof --targets web,tray
          test -s iconflow.toml
          iconflow doctor --no-browser

  chromium-integration:
    name: Installed-wheel Chromium security and render
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Build and install wheel with Chromium
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          python -m playwright install --with-deps chromium
      - name: Test the installed renderer outside the checkout
        shell: bash
        run: |
          integration="$RUNNER_TEMP/iconflow-browser-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$integration"
          cd "$integration"
          iconflow doctor
          ICONFLOW_BROWSER_TESTS=1 python "$GITHUB_WORKSPACE/tests/test_browser_security.py" -v
          python - <<'PY' > "$integration/presets.txt"
          from iconflow.styles import PRESETS
          print("\n".join(PRESETS))
          PY
          while IFS= read -r preset; do
            iconflow new "$preset" --out "$integration/$preset.svg"
            iconflow check "$integration/$preset.svg"
            iconflow render "$integration/$preset.svg" \
              --sizes 16,32 --out "$integration/$preset-{size}.png"
          done < "$integration/presets.txt"
          iconflow styles --gallery "$integration/style-gallery.png"
          test -s "$integration/style-gallery.png"
