name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Verify and package (no publication)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate an optional tag against package version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - name: Test, build, and inspect
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m unittest discover -s tests
          iconflow case lint
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --outdir dist
          python scripts/verify_distribution.py dist/*
          python -m build --wheel --outdir wheel-rebuild
          cmp dist/*.whl wheel-rebuild/*.whl
      - name: Smoke-test the wheel outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m playwright install --with-deps chromium
          smoke="$RUNNER_TEMP/iconflow-release-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$smoke"
          cd "$smoke"
          iconflow --help >/dev/null
          iconflow doctor --no-browser
          iconflow styles --json > styles.json
          python -c 'import json; assert len(json.load(open("styles.json", encoding="utf-8"))) >= 10'
          iconflow new line-mark --out master.svg
          iconflow check master.svg
      - name: Write checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload verified candidate artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-iconflow-release-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
