      <stop offset="0" stop-color="#FFB46B" stop-opacity=".8"/>
      <stop offset="1" stop-color="#F46482" stop-opacity=".58"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="#151927"/>
  <rect x="152" y="168" width="560" height="560" rx="136"
