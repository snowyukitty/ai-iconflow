# IconFlow project brief and deterministic build contract.
# Relative paths are resolved from this file.
schema_version = 1

[project]
name = "Trail Tail"
master = "master.svg"
output = "build"
casebook = "../../casebook"

[brief]
app_intent = "remember a dog walking route through one companion mark"
user_job = "recognize and return to a favorite walking route"
essence = "roam"
personality = ["alert", "friendly", "direct"]

[design]
palette = ["graphite #252731", "warm paper #FFF4E8", "coral clasp #FF5A4F"]
cliches = ["paw", "map pin", "dog head"]
signature_device = "one dog contour becomes the route and carries an off-axis clasp"
device_family = "path-relationship"
device_detail = "single uniform side-view contour with rotated coral square clasp"
concept_lens = "negative-space"

[build]
targets = ["web"]
theme_color = "#252731"
background_color = "#FFF4E8"
electron_radius = 0
tray_ts = false
tray_svg = ""
tray_template_mode = "auto"
color_scheme = "light"
optimize_png = true

[review]
status = "pending"
source_sha256 = ""
contract_sha256 = ""
# Review Lab receipt is preferred. For this manual fallback, set status to
# "approved" and copy both hashes from the exported receipt; `ship` requires every
# score >= 4 and rejects any changed source, target, or visual transform.
scores = {}
notes = ""
