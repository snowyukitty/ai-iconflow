# IconFlow project brief and deterministic build contract.
# Relative paths are resolved from this file.
schema_version = 1

[project]
name = "Boss Helm"
master = "master.svg"
output = "build"
casebook = "../../casebook"

[brief]
app_intent = "mark a hard-won team raid achievement"
user_job = "recognize and remember a conquered encounter"
essence = "conquer"
personality = ["formidable", "precise", "earned"]

[design]
palette = ["void #11151E", "chrome #F4F6FA", "ember #FF5A4F"]
cliches = ["trophy", "crown", "skull", "sword", "gamepad"]
signature_device = "one horn is structurally broken and exposes an ember fracture"
device_family = "asymmetry-punctuation"
device_detail = "frontal chrome helmet with unequal horn silhouette and broad hard value bands"
concept_lens = "silhouette-first"

[build]
targets = ["web"]
theme_color = "#11151E"
background_color = "#11151E"
electron_radius = 0
tray_ts = false
tray_svg = ""
tray_template_mode = "auto"
color_scheme = "light"
optimize_png = true

[review]
status = "pending"
source_sha256 = ""
contract_sha256 = ""
# Review Lab receipt is preferred. For this manual fallback, set status to
# "approved" and copy both hashes from the exported receipt; `ship` requires every
# score >= 4 and rejects any changed source, target, or visual transform.
scores = {}
notes = ""
