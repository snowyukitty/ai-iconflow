<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Kiln — a detail-ladder worked example</title>
  <desc id="desc">A domed kiln with an offset chimney and one broad stoke mouth. The mouth holds an ember from 49px up, and the clay gains brick coursing and a rim light from 257px up.</desc>
  <defs>
    <clipPath id="kiln-body-clip">
      <path d="M150 856V566A362 362 0 0 1 874 566V856Z"/>
    </clipPath>
  </defs>

  <rect id="card" width="1024" height="1024" rx="228" fill="#1E1B22"/>

  <!-- glyph rung: everything that defines the outer contour. The ladder grows
       inward, so the chimney and the plinth - the two traits that make this
       silhouette a kiln and not a dome - are here, at 16px, where they decide
       whether the icon is recognisable at all. -->
  <g data-lod="glyph mark plate">
    <path id="chimney" d="M690 348L700 176Q702 142 736 142H814Q848 142 850 176L860 348Z" fill="#F0DFC6"/>
    <path id="dome" d="M150 856V566A362 362 0 0 1 874 566V856Z" fill="#F0DFC6"/>
    <rect id="plinth" x="112" y="828" width="800" height="72" rx="26" fill="#F0DFC6"/>
    <path id="stoke-mouth" d="M340 872V644A172 172 0 0 1 684 644V872Z" fill="#1E1B22"/>
  </g>

  <!-- mark rung: the second reading, entirely inside the contour above. At
       49px there is room to say the kiln is lit; at 16px there is not.
       A chimney collar lived here in the first draft. It was dark clay laid
       across the chimney, so from 49px up it read as a joint and cut the
       chimney off the dome — a change to how the OUTER contour reads, made by
       a rung that is only allowed to work inside one. The same-mark overlay
       painted it coral, and it was removed rather than tuned. -->
  <g data-lod="mark plate">
    <rect id="ember" x="376" y="690" width="272" height="182" rx="46" fill="#FF6A3D"/>
  </g>

  <!-- plate rung: material. None of it touches the outer contour, so the
       footprint is identical to the glyph rung and the mark stays the mark. -->
  <g data-lod="plate" clip-path="url(#kiln-body-clip)">
    <path id="course-1" d="M150 620H874" stroke="#D9BF9C" stroke-width="12"/>
    <path id="course-2" d="M150 726H874" stroke="#D9BF9C" stroke-width="12"/>
    <path id="course-3" d="M212 514H812" stroke="#D9BF9C" stroke-width="12"/>
    <path id="joints" d="M262 620V726M760 620V726M512 514V620M330 414V514M694 414V514" stroke="#D9BF9C" stroke-width="12"/>
    <path id="rim-light" d="M196 604A316 316 0 0 1 430 300" fill="none" stroke="#FFF4E4" stroke-width="26" stroke-linecap="round"/>
  </g>
  <g data-lod="plate">
    <rect id="ember-core" x="424" y="742" width="176" height="112" rx="34" fill="#FFB067"/>
    <circle id="spark" cx="512" cy="586" r="26" fill="#FF6A3D"/>
  </g>
</svg>
