<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<title>Three rising panels (first draft)</title>
<!-- A display-brightness tool: three screens, each a little brighter and
     taller than the last. Read as source it is a reasonable idea. Read at 16px
     it is a bar chart, because a row of same-width blocks of rising height is
     a bar chart whatever the designer meant (docs/LEARNINGS.md L27), and the
     neighbourhood measures it 0.07 from the collision set's bar chart. -->
<rect width="1024" height="1024" rx="228" fill="#1E2029"/>
<rect x="144" y="500" width="200" height="380" rx="24" fill="#F4EFE6"/>
<rect x="412" y="340" width="200" height="540" rx="24" fill="#F4EFE6"/>
<rect x="680" y="180" width="200" height="700" rx="24" fill="#F4EFE6"/>
</svg>
